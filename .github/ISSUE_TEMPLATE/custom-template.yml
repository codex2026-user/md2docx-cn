name: 定制排版需求
description: 申请 Word 模板、批量转换或工作流集成报价
title: "[定制] "
labels:
  - customization
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开页面。请勿上传未发表全文、客户文件、个人信息、密钥或付款信息。
  - type: dropdown
    id: service
    attributes:
      label: 服务类型
      options:
        - 调整现有排版参数
        - 制作专用 Word 模板
        - 批量转换或工作流集成
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: 需求说明
      description: 只写结构、格式要求和预期交付，不要粘贴敏感正文。
      placeholder: 例如：标题三号黑体，正文小四宋体，1.5 倍行距，需要页码。
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: 希望完成时间
      placeholder: 例如：一周内
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我确认没有在公开 Issue 中提供敏感数据或未授权材料。
          required: true

