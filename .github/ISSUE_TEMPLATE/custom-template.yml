name: 定制排版需求
description: 申请 Word 模板、批量转换、OEM 集成或维护支持报价
title: "[定制] "
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开页面。请勿上传未发表全文、客户文件、个人信息、密钥或付款信息。
        提交后请将 Issue 链接发送至业务邮箱 1066536086@qq.com；支付宝付款方式只通过非公开渠道提供。
  - type: dropdown
    id: service
    attributes:
      label: 服务类型
      options:
        - 调整现有排版参数
        - 制作专用 Word 模板
        - 批量转换或工作流集成
        - 团队内部工具或 OEM 集成
        - 持续维护和优先支持
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: 需求说明
      description: 只写结构、格式要求和预期交付，不要粘贴敏感正文。
      placeholder: 例如：标题三号黑体，正文小四宋体，1.5 倍行距，需要页码。
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: 希望完成时间
      placeholder: 例如：一周内
  - type: dropdown
    id: budget
    attributes:
      label: 预算区间
      description: 仅用于判断方案范围，不代表最终报价或下单。
      options:
        - 100 元以内
        - 100–499 元
        - 500–999 元
        - 1000 元及以上
        - 暂不确定
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我确认没有在公开 Issue 中提供敏感数据或未授权材料。
          required: true
        - label: 我理解提交需求不等于下单，范围、价格、付款节点和交付时间以付款前的书面确认为准。
          required: true
