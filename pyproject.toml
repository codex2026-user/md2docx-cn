[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx-cn"
version = "0.1.1"
description = "Convert Chinese Markdown articles into polished Word documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
]

[project.scripts]
md2docx-cn = "md2docx_cn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
